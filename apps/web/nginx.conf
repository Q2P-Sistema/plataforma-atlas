server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nao pode ser cacheado pelo navegador. Ele referencia os assets
    # com hash (o cache longo abaixo e para eles, nao para o shell). Sem isto,
    # um index.html servido sem Cache-Control (ex.: o fallback abaixo, durante
    # uma janela de deploy) fica no cache heuristico do Chrome por ~1h30 e some
    # com o /me da API, que responde 200 igual (achado em UAT 25/09/2026, ver
    # server.ts).
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Este container so serve o SPA. /api/ e domínio do Traefik (rota direta
    # pro servico da API); se uma requisicao pra /api/ CHEGAR aqui mesmo assim
    # (ex.: janela de deploy em que o router da API ainda nao esta saudavel e o
    # Traefik cai no Host-only router do web), NAO deve virar o fallback do SPA
    # -- isso gerava um 200 com index.html pra /api/v1/auth/me, cacheado pelo
    # navegador, derrubando sessoes recem-autenticadas depois de todo redeploy.
    location /api/ {
        return 502;
    }

    # Cache longo pra assets com hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
