name: Docker Image CI

on:
  workflow_run:
    workflows: ["Create Release Tag"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5
        with:
          # workflow_run NAO herda o branch que disparou a "Create Release Tag": ele roda
          # com a definicao deste arquivo na branch padrao do repo e, sem `ref` explicito,
          # faz checkout da PONTA dessa branch padrao — nao do commit que foi taggeado.
          # Quando a branch que gerou a tag (ex.: a main, num PR direto) esta a frente da
          # branch padrao (hoje a uat), a imagem construida e a da branch padrao, nao a da
          # tag (ACXEGDP-437: v1.1.19 saiu com o codigo da uat, sem a feature 017).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Buscar última tag criada
        run: |
          git fetch --tags
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "Última versão encontrada: $LAST_TAG"
          echo "VERSION=$LAST_TAG" >> $GITHUB_ENV

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push — Atlas API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            plasticosq2p/atlas-api:latest
            plasticosq2p/atlas-api:${{ env.VERSION }}

      - name: Build e push — Atlas Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            plasticosq2p/atlas-web:latest
            plasticosq2p/atlas-web:${{ env.VERSION }}
