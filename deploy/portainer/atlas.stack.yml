version: "3.8"

# =============================================================================
# Stack de PRODUÇÃO do Atlas — atlas.q2p.com.br
# A stack se chama `atlas` no Portainer. O Redis de PROD roda numa stack
# SEPARADA: REDIS_URL aponta para ele pelo nome completo `<stack>_<serviço>`
# (no Swarm o nome curto não resolve entre stacks).
# Env: use deploy/portainer/atlas.env.example como template.
#
# Imagem com TAG DE VERSÃO FIXA via ATLAS_VERSION no env da stack (ex. v1.1.14),
# não :latest: rollback = trocar a tag no env; um push futuro na main não altera
# produção por acidente. Atenção: `${ATLAS_VERSION:v1.1.14}` é sintaxe inválida no
# compose (falta o `-`); use `${ATLAS_VERSION}` ou `${ATLAS_VERSION:-v1.1.14}`.
# =============================================================================

# ── SERVIÇOS ────────────────────────────────────────────────
services:
  # ── ATLAS API ─────────────────────────────────────────────
  atlas_api:
    image: plasticosq2p/atlas-api:${ATLAS_VERSION}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    environment:
      NODE_ENV: production
      API_PORT: "3005"

      # App é Brasil-only: roda o container em BRT para a lógica de datas locais
      # (ex: "Data do Movimento" do ajuste OMIE, via getDate/getMonth). Sem isto o
      # container fica em UTC e, após ~21h BRT, manda a data de amanhã -> OMIE rejeita.
      TZ: America/Sao_Paulo

      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}

      # SEED_ADMIN_* OMITIDOS de propósito: atlas.users chega populada da UAT
      # (transplante do cutover). seedAdmin() não roda com a tabela populada, e
      # a ausência aqui evita que uma cópia falha seja mascarada por um admin
      # fantasma recém-semeado.

      N8N_HEALTH_URL: ${N8N_HEALTH_URL}

      # URL base do frontend — allowlist de CORS + links dos e-mails (sem barra final)
      APP_URL: ${APP_URL:-https://atlas.q2p.com.br}

      # ── E-mail transacional (SendGrid) ───────
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}

      # ── StockBridge — integração OMIE (dual-CNPJ) ───
      # PRODUÇÃO: OMIE_MODE obrigatório e =real. O guard STK-15 derruba o boot
      # com mock+NODE_ENV=production — não existe fase mock em produção.
      OMIE_MODE: ${OMIE_MODE:?OMIE_MODE obrigatorio em producao (real)}
      OMIE_API_URL: ${OMIE_API_URL:-https://app.omie.com.br/api/v1/}
      OMIE_ACXE_KEY: ${OMIE_ACXE_KEY}
      OMIE_ACXE_SECRET: ${OMIE_ACXE_SECRET}
      OMIE_Q2P_KEY: ${OMIE_Q2P_KEY}
      OMIE_Q2P_SECRET: ${OMIE_Q2P_SECRET}

      # CC do admin em e-mails operacionais do StockBridge.
      # ATENÇÃO: string vazia quebra o boot (Zod valida email) — preencher ou
      # remover a variável do env da stack.
      STOCKBRIDGE_ADMIN_CC_EMAIL: ${STOCKBRIDGE_ADMIN_CC_EMAIL}
      # Data de corte (YYYY-MM-DD) p/ gap fiscal/físico no Cockpit. Sem set: 180d atrás.
      STOCKBRIDGE_FISCAL_CUTOFF_DATE: ${STOCKBRIDGE_FISCAL_CUTOFF_DATE}

      # Feature 015 (ACXEGDP-328): recebimento nacional por NF.
      # Data de corte FIXA (YYYY-MM-DD). No go-live: MESMO valor do UAT — a operacao
      # nacional ja roda la e e transplantada; outra data esconderia NF pendente ou
      # re-apresentaria NF ja baixada. Sem ela a fila devolve 503 (nao ha default).
      STOCKBRIDGE_RECEBIMENTO_NACIONAL_DATA_CORTE: ${STOCKBRIDGE_RECEBIMENTO_NACIONAL_DATA_CORTE:-}
      # Baixa por "recebimento fora do Atlas" (aprovacao de gestor). Default ligado;
      # 'false' desliga sem migration quando o modulo estiver validado.
      STOCKBRIDGE_RECEBIMENTO_EXTERNO_ENABLED: ${STOCKBRIDGE_RECEBIMENTO_EXTERNO_ENABLED:-true}

      # ACXEGDP-344: baixa do pedido de compra Q2P no OMIE (AlteraPedCompra) apos o
      # recebimento de importacao — disparo do fluxo, cron horario e retry do painel.
      # Default ligado. 'false' = kill switch sem redeploy do compose (as entradas
      # ficam 'pendente' e sao processadas depois; nada se perde).
      STOCKBRIDGE_BAIXA_PEDIDO_Q2P_ENABLED: ${STOCKBRIDGE_BAIXA_PEDIDO_Q2P_ENABLED:-true}

      # Feature 016 (ACXEGDP-395): recebimento FISCAL da NF nacional pelo Atlas — ESCREVE
      # no OMIE (AlterarRecebimento + ConcluirRecebimento). Default DESLIGADO; ligar so
      # depois da migration 0053 e do espelho tbl_recebimentoNFe_Q2P populado pelo n8n.
      # Desligado em PROD desde 21/10/2026 (contencao da ACXEGDP-437): religar SO com a
      # imagem da feature 017 e o teste do vinculo novo (ASSOCIAR-PEDIDO) aprovado — com
      # imagem anterior, o IGNORAR volta a desfazer o vinculo do item com o PC.
      STOCKBRIDGE_RECEBIMENTO_FISCAL_ENABLED: ${STOCKBRIDGE_RECEBIMENTO_FISCAL_ENABLED:-false}
      # Recebimento fiscal revertido no portal do OMIE depois de concluido (feature 017,
      # research D21): a NF volta a fila como fiscal pendente e o Atlas conclui de novo.
      # Padrao ligado; false = kill switch. Exige a migration 0060 aplicada antes da imagem.
      STOCKBRIDGE_FISCAL_REVERTIDO_ENABLED: ${STOCKBRIDGE_FISCAL_REVERTIDO_ENABLED:-true}
      # Destinatarios dos avisos "NF dispensada da fila" e "Recebimento fiscal desfeito no
      # OMIE" (D21 da 017) ao fiscal (lista separada por virgula).
      # Vazio = default do codigo (NFe ACXE, Mauricio Yared, Gustavo Dreer).
      STOCKBRIDGE_FISCAL_EMAILS: ${STOCKBRIDGE_FISCAL_EMAILS:-}
      # Idade maxima (min) do espelho de recebimentos de NF-e antes de degradar o health
      # e alertar STOCKBRIDGE_OPS_EMAIL (cron 5,35). PROD: 120 (n8n a cada 30 min).
      STOCKBRIDGE_ESPELHO_RECEBIMENTOS_MAX_MIN: ${STOCKBRIDGE_ESPELHO_RECEBIMENTOS_MAX_MIN:-120}
      # Feature 017 (ACXEGDP-437): recebimento nacional com pedido de compra (PC).
      # NF com item sem PC possivel: true (default) recusa a NF (422 NF_SEM_PC) e avisa
      # compras; false recebe o item sem vinculo (receita da 016) e avisa compras.
      STOCKBRIDGE_RECEBIMENTO_NACIONAL_EXIGE_PC: ${STOCKBRIDGE_RECEBIMENTO_NACIONAL_EXIGE_PC:-true}
      # Tolerancias da sugestao de PC (%): quantidade acima do saldo e diferenca de preco por kg.
      STOCKBRIDGE_PC_TOLERANCIA_QTD_PCT: ${STOCKBRIDGE_PC_TOLERANCIA_QTD_PCT:-2}
      STOCKBRIDGE_PC_TOLERANCIA_PRECO_PCT: ${STOCKBRIDGE_PC_TOLERANCIA_PRECO_PCT:-1}
      # Aviso "NF sem pedido de compra no OMIE" (lista separada por virgula). Vazio = STOCKBRIDGE_OPS_EMAIL.
      STOCKBRIDGE_COMPRAS_EMAILS: ${STOCKBRIDGE_COMPRAS_EMAILS:-}
      # Idade maxima (min) da copia de PCs antes de degradar o health, alertar o ops e
      # recusar o recebimento com fiscal pendente (503 COPIA_PCS_DEFASADA). PROD: 120.
      STOCKBRIDGE_COPIA_PCS_MAX_MIN: ${STOCKBRIDGE_COPIA_PCS_MAX_MIN:-120}
      # PC em unidade diferente da NF (NF em toneladas x PC em kg): bloquear (default) = o PC nao e
      # oferecido e a NF e recusada; converter = o EDITAR manda a quantidade recebida ja na unidade do
      # PC (o OMIE baixa o pedido na unidade da NF sem converter — NF 60199 x PC 306, 22/10/2026).
      STOCKBRIDGE_PC_UNIDADE_DIFERENTE: ${STOCKBRIDGE_PC_UNIDADE_DIFERENTE:-bloquear}
      # Baixa do PC pelo peso conferido (research D20 da 017): o peso da balanca acima da NF vai como
      # quantidade recebida no fiscal, com teto no saldo do PC (NF 67988 x PC 305, 23/10/2026). Default
      # false; exige a migration 0059 antes da imagem; ligar com o primeiro uso acompanhado.
      STOCKBRIDGE_PC_BAIXA_PESO_CONFERIDO: ${STOCKBRIDGE_PC_BAIXA_PESO_CONFERIDO:-false}
      # Excedente acima deste % da NF do item nao vai ao PC (provavel erro de digitacao).
      STOCKBRIDGE_PC_PESO_CONFERIDO_MAX_PCT: ${STOCKBRIDGE_PC_PESO_CONFERIDO_MAX_PCT:-10}
      # Feature 017, Historia 5: NF de compra nacional da ACXE na fila (default false). So vale com
      # STOCKBRIDGE_RECEBIMENTO_FISCAL_ENABLED=true e com o corte da ACXE (YYYY-MM-DD, definido na ativacao;
      # a ACXE recebe hoje pelo portal com estoque e NF anterior ao corte nunca entra na fila).
      STOCKBRIDGE_RECEBIMENTO_NACIONAL_ACXE_ENABLED: ${STOCKBRIDGE_RECEBIMENTO_NACIONAL_ACXE_ENABLED:-false}
      STOCKBRIDGE_RECEBIMENTO_NACIONAL_ACXE_DATA_CORTE: ${STOCKBRIDGE_RECEBIMENTO_NACIONAL_ACXE_DATA_CORTE:-}
      # Destinatarios dos e-mails operacionais. Vazio = default do codigo
      # (comex_acxe@acxe-polimeros.com.br / flavio.endo@acxe-polimeros.com.br).
      STOCKBRIDGE_COMEX_EMAIL: ${STOCKBRIDGE_COMEX_EMAIL:-}
      STOCKBRIDGE_OPS_EMAIL: ${STOCKBRIDGE_OPS_EMAIL:-}

      # Shared secret n8n ↔ Atlas (saídas automáticas + mapa NF↔pedido).
      # Deve ser IDÊNTICO ao ATLAS_INTEGRATION_KEY da instância n8n.
      ATLAS_INTEGRATION_KEY: ${ATLAS_INTEGRATION_KEY}

      # ── Feature Flags ────────────────────────
      # Go-live: os 4 módulos validados no UAT entram ligados.
      MODULE_HEDGE_ENABLED: ${MODULE_HEDGE_ENABLED:-true}
      MODULE_STOCKBRIDGE_ENABLED: ${MODULE_STOCKBRIDGE_ENABLED:-true}
      MODULE_BREAKINGPOINT_ENABLED: ${MODULE_BREAKINGPOINT_ENABLED:-true}
      MODULE_FORECAST_ENABLED: ${MODULE_FORECAST_ENABLED:-true}
      MODULE_CLEVEL_ENABLED: ${MODULE_CLEVEL_ENABLED:-false}
      MODULE_COMEXINSIGHT_ENABLED: ${MODULE_COMEXINSIGHT_ENABLED:-false}
      MODULE_COMEXFLOW_ENABLED: ${MODULE_COMEXFLOW_ENABLED:-false}

      # ── Autenticação ─────────────────────────
      # 2FA ligado em produção (default já é true; linha explícita p/ auditoria).
      AUTH_2FA_ENABLED: ${AUTH_2FA_ENABLED:-true}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.http.routers.atlas-api.rule=Host(`atlas.q2p.com.br`) && PathPrefix(`/api`)
        - traefik.http.routers.atlas-api.entrypoints=websecure
        - traefik.http.routers.atlas-api.tls=true
        - traefik.http.routers.atlas-api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.atlas-api.service=atlas-api
        - traefik.http.services.atlas-api.loadbalancer.server.port=3005
        - traefik.http.services.atlas-api.loadbalancer.server.scheme=http

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      # network_swarm_public: ingress do Traefik E a rede onde está o Postgres de
      # PROD (:5432) — a mesma da stack n8n (P2 do runbook, informado em 25/09).
      # Se o /health mostrar postgres down, conferir com
      # `docker network inspect network_swarm_public` qual serviço é o Postgres.
      # O Redis (stack separada) precisa estar alcançável por esta rede; se ele
      # estiver em outra overlay, acrescente-a aqui e em `networks:` no fim.
      - network_swarm_public

  # ── ATLAS WEB ─────────────────────────────────────────────
  atlas_web:
    image: plasticosq2p/atlas-web:${ATLAS_VERSION}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.http.routers.atlas-web.rule=Host(`atlas.q2p.com.br`)
        - traefik.http.routers.atlas-web.entrypoints=websecure
        - traefik.http.routers.atlas-web.tls=true
        - traefik.http.routers.atlas-web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.atlas-web.service=atlas-web
        - traefik.http.routers.atlas-web.priority=1
        - traefik.http.services.atlas-web.loadbalancer.server.port=80
        - traefik.http.services.atlas-web.loadbalancer.server.scheme=http

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - network_swarm_public

# ── REDES DOCKER ────────────────────────────────────────────
# network_swarm_public = ingress público do Traefik (roteia atlas.q2p.com.br)
#                        + Postgres de PROD (:5432) + Redis (stack separada).
networks:
  network_swarm_public:
    external: true
